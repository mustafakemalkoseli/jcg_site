server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # www'suz gelen istekleri www'ya yonlendir
    if ($host = "justcreativegames.com") {
        return 301 https://www.justcreativegames.com$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /privacy -> privacy.html de calissin
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
